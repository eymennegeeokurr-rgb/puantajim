<!DOCTYPE html>
<html lang="tr">
<head>
  <!-- GitHub Pages gibi alt klasörde yayınlamak için derlemede --base-href verilir -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Puantajım - Kişisel puantaj, mesai, avans ve hakediş defteri. İnternetsiz çalışır.">

  <!-- Ana ekrana eklenince tam ekran uygulama gibi açılsın (iPhone + Android) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Puantajım">
  <meta name="theme-color" content="#1E6FA8">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Puantajım</title>

  <style>
    html, body { margin: 0; height: 100%; background: #F8F9FF; }
    @media (prefers-color-scheme: dark) { html, body { background: #101418; } }
    #acilis {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: -apple-system, system-ui, sans-serif; color: #1E6FA8;
    }
    #acilis img { width: 96px; height: 96px; border-radius: 22px; }
    #acilis .cubuk { width: 140px; height: 4px; border-radius: 2px; background: #CEE5FF; overflow: hidden; }
    #acilis .cubuk::after {
      content: ''; display: block; width: 40%; height: 100%; background: #1E6FA8;
      animation: kay 1.1s ease-in-out infinite;
    }
    @keyframes kay { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  </style>
</head>
<body>
  <!-- Flutter yüklenene kadar görünen açılış ekranı -->
  <div id="acilis">
    <img src="icons/Icon-192.png" alt="">
    <div style="font-weight:600">Puantajım</div>
    <div class="cubuk"></div>
  </div>

  <script>
    // İlk kare çizilince açılış ekranını kaldır
    window.addEventListener('flutter-first-frame', function () {
      var e = document.getElementById('acilis');
      if (e) e.remove();
    });

    // Çevrimdışı çalışma: dosyaları önbelleğe alan servis çalışanı
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) {
          console.warn('Servis çalışanı kaydedilemedi', e);
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
